<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1241px" preserveAspectRatio="none" style="width:3555px;height:1241px;background:#FFFFFF;" version="1.1" viewBox="0 0 3555 1241" width="3555px" zoomAndPan="magnify"><title>REGULA-CAC &#8212; AS-IS</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="165.9219" x="1693.4319" y="32.9951">REGULA-CAC &#8212; AS-IS</text></g><ellipse cx="2202.1301" cy="57.2969" fill="#333333" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#DDEEFF" height="33.9688" rx="12.5" ry="12.5" style="stroke:#416783;stroke-width:0.5;" width="256.6426" x="2073.8088" y="87.2969"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="236.6426" x="2083.8088" y="108.4355">Operador acessa a p&#225;gina 2 &#8212; Pessoas</text><rect fill="#DDEEFF" height="33.9688" rx="12.5" ry="12.5" style="stroke:#416783;stroke-width:0.5;" width="228.6582" x="2087.801" y="141.2656"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="208.6582" x="2097.801" y="162.4043">Informa CPF e aciona Buscar/Enter</text><rect fill="#DDEEFF" height="47.9375" rx="12.5" ry="12.5" style="stroke:#416783;stroke-width:0.5;" width="225.8105" x="2089.2249" y="195.2344"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="154.2891" x="2099.2249" y="216.373">Processo "Converter CPF"</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="205.8105" x="2099.2249" y="230.3418">remove caracteres n&#227;o num&#233;ricos</text><rect fill="#DDEEFF" height="47.9375" rx="12.5" ry="12.5" style="stroke:#416783;stroke-width:0.5;" width="292.6777" x="2055.7913" y="263.1719"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="272.6777" x="2065.7913" y="284.3105">Processo "Registra CR" executa SELECT INTO</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="191.1035" x="2065.7913" y="298.2793">em CR_PROD_CTRLDO pelo CPF</text><path d="M2320.1904,321.1094 L2320.1904,527.8359 L2688.5405,527.8359 L2688.5405,331.1094 L2678.5405,321.1094 L2320.1904,321.1094" fill="#FFF2B3" style="stroke:#8A6D1D;stroke-width:0.5;"/><path d="M2678.5405,321.1094 L2678.5405,331.1094 L2688.5405,331.1094 L2678.5405,321.1094" fill="#FFF2B3" style="stroke:#8A6D1D;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="332.395" x="2326.1904" y="338.1763">P&#225;gina 36: p&#225;gina identificada como TEMPOR&#193;RIO.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="330.1162" x="2326.1904" y="353.3091">O export n&#227;o apresenta link de navega&#231;&#227;o para as</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="306.5918" x="2326.1904" y="368.4419">p&#225;ginas 36 e 37. Portanto, n&#227;o se afirma que o</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="313.644" x="2326.1904" y="383.5747">operador percorra esse caminho no uso normal.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="330.2305" x="2326.1904" y="398.7075">O processo da p&#225;gina 36 cont&#233;m PUT de altera&#231;&#227;o</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="314.9009" x="2326.1904" y="413.8403">de status no provedor SIGMA para CR existente;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="127.5371" x="2326.1904" y="428.9731">isso n&#227;o &#233; emiss&#227;o.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="2326.1904" y="444.106">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="312.0762" x="2326.1904" y="459.2388">POST /cr/historico &#233; relacionado a hist&#243;rico, n&#227;o</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="347.3501" x="2326.1904" y="474.3716">comprova cria&#231;&#227;o de CR. POST/DELETE de atividades</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="343.3447" x="2326.1904" y="489.5044">aparecem como implementa&#231;&#227;o futura/coment&#225;rios.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="310.3306" x="2326.1904" y="504.6372">O mecanismo oficial de cria&#231;&#227;o/emiss&#227;o n&#227;o foi</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="278.8398" x="2326.1904" y="519.77">identificado no export da aplica&#231;&#227;o 11072.</text><polygon fill="#FFF2B3" points="2096.0698,527.8359,2308.1904,527.8359,2320.1904,539.8359,2308.1904,551.8359,2096.0698,551.8359,2084.0698,539.8359,2096.0698,527.8359" style="stroke:#8A6D1D;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="212.1206" x="2096.0698" y="543.644">Existe exatamente um CR para o CPF?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="20.7539" x="2063.3159" y="537.2417">Sim</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="156.8467" x="2320.1904" y="537.2417">N&#227;o encontrado ou amb&#237;guo</text><path d="M1552.5435,565.0898 L1552.5435,588.7891 L1532.5435,592.7891 L1552.5435,596.7891 L1552.5435,620.4883 A0,0 0 0 0 1552.5435,620.4883 L1824.7964,620.4883 A0,0 0 0 0 1824.7964,620.4883 L1824.7964,575.0898 L1814.7964,565.0898 L1552.5435,565.0898 A0,0 0 0 0 1552.5435,565.0898" fill="#FFF2B3" style="stroke:#8A6D1D;stroke-width:0.5;"/><path d="M1814.7964,565.0898 L1814.7964,575.0898 L1824.7964,575.0898 L1814.7964,565.0898" fill="#FFF2B3" style="stroke:#8A6D1D;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="251.2529" x="1558.5435" y="582.1567">Na p&#225;gina 2, as a&#231;&#245;es "Alterar n&#237;vel" e</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="232.7114" x="1558.5435" y="597.2896">"Alterar status" s&#227;o protegidas pela</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="196.6567" x="1558.5435" y="612.4224">autoriza&#231;&#227;o ATIVIDADES_CAC.</text><rect fill="#DDEEFF" height="61.9063" rx="12.5" ry="12.5" style="stroke:#416783;stroke-width:0.5;" width="257.1875" x="1275.356" y="561.8359"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="187.0664" x="1285.356" y="582.9746">Regi&#227;o Pessoas exibe a pessoa</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="233.7656" x="1285.356" y="596.9434">mesmo quando n&#227;o h&#225; CR (LEFT JOIN);</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="237.1875" x="1285.356" y="610.9121">quando encontrado, exibe dados do CR</text><rect fill="#DDEEFF" height="33.9688" rx="12.5" ry="12.5" style="stroke:#416783;stroke-width:0.5;" width="234.2188" x="1286.8403" y="647.7109"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="214.2188" x="1296.8403" y="668.8496">Operador seleciona a&#231;&#227;o dispon&#237;vel</text><polygon fill="#FFF2B3" points="459.7173,741.6797,520.7383,741.6797,532.7383,753.6797,520.7383,765.6797,459.7173,765.6797,447.7173,753.6797,459.7173,741.6797" style="stroke:#8A6D1D;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="134.4331" x="494.2278" y="775.8901">Alterar status &#8212; p&#225;g. 32</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="61.021" x="459.7173" y="757.4878">Qual a&#231;&#227;o?</text><rect fill="#DDEEFF" height="47.9375" rx="12.5" ry="12.5" style="stroke:#416783;stroke-width:0.5;" width="207.3594" x="386.5481" y="798.4844"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="187.3594" x="396.5481" y="819.623">Valida que o novo status difere</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="89.8125" x="396.5481" y="833.5918">do status atual</text><polygon fill="#FFF2B3" points="448.8489,881.4219,531.6067,881.4219,543.6067,893.4219,531.6067,905.4219,448.8489,905.4219,436.8489,893.4219,448.8489,881.4219" style="stroke:#8A6D1D;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="82.7578" x="448.8489" y="897.23">Status mudou?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="20.7539" x="416.095" y="890.8276">Sim</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="21.6992" x="543.6067" y="890.8276">N&#227;o</text><rect fill="#DDEEFF" height="33.9688" rx="12.5" ry="12.5" style="stroke:#416783;stroke-width:0.5;" width="336.084" x="11" y="915.4219"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="316.084" x="21" y="936.5605">Insere ocorr&#234;ncia em HISTORICO_CR_PROD_CTRLDO</text><rect fill="#DDEEFF" height="33.9688" rx="12.5" ry="12.5" style="stroke:#416783;stroke-width:0.5;" width="327.8457" x="15.1191" y="984.3906"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="307.8457" x="25.1191" y="1005.5293">Registra auditoria em RGCTB008_ALTERACAO_CAC</text><path d="M340.1807,1053.3594 L340.1807,1077.0586 L320.1807,1081.0586 L340.1807,1085.0586 L340.1807,1108.7578 A0,0 0 0 0 340.1807,1108.7578 L658.8667,1108.7578 A0,0 0 0 0 658.8667,1108.7578 L658.8667,1063.3594 L648.8667,1053.3594 L340.1807,1053.3594 A0,0 0 0 0 340.1807,1053.3594" fill="#FFF2B3" style="stroke:#8A6D1D;stroke-width:0.5;"/><path d="M648.8667,1053.3594 L648.8667,1063.3594 L658.8667,1063.3594 L648.8667,1053.3594" fill="#FFF2B3" style="stroke:#8A6D1D;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="205.334" x="346.1807" y="1070.4263">[CONFIRMAR IMPLEMENTA&#199;&#195;O]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="290.8877" x="346.1807" y="1085.5591">O UPDATE da p&#225;gina 32 filtra por :P2_NOME,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="297.686" x="346.1807" y="1100.6919">n&#227;o por :P32_CPF. Confirmar se &#233; intencional.</text><rect fill="#DDEEFF" height="47.9375" rx="12.5" ry="12.5" style="stroke:#416783;stroke-width:0.5;" width="282.2773" x="37.9033" y="1057.0898"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="262.2773" x="47.9033" y="1078.2285">Atualiza STATUS_IND e campo de valida&#231;&#227;o</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="135.2813" x="47.9033" y="1092.1973">em CR_PROD_CTRLDO</text><rect fill="#DDEEFF" height="33.9688" rx="12.5" ry="12.5" style="stroke:#416783;stroke-width:0.5;" width="245.0938" x="668.8667" y="915.4219"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="225.0938" x="678.8667" y="936.5605">Exibe erro: novo status igual ao atual</text><polygon fill="#FFF2B3" points="490.2278,1114.7578,502.2278,1126.7578,490.2278,1138.7578,478.2278,1126.7578,490.2278,1114.7578" style="stroke:#8A6D1D;stroke-width:0.5;"/><polygon fill="#FFF2B3" points="1022.313,741.6797,1153.4536,741.6797,1165.4536,753.6797,1153.4536,765.6797,1022.313,765.6797,1010.313,753.6797,1022.313,741.6797" style="stroke:#8A6D1D;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="131.1406" x="1022.313" y="757.4878">Alterar datas &#8212; p&#225;g. 40</text><rect fill="#DDEEFF" height="33.9688" rx="12.5" ry="12.5" style="stroke:#416783;stroke-width:0.5;" width="280.4141" x="947.6763" y="785.6797"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="260.4141" x="957.6763" y="806.8184">Exige refer&#234;ncia SEI e unidade respons&#225;vel</text><rect fill="#DDEEFF" height="47.9375" rx="12.5" ry="12.5" style="stroke:#416783;stroke-width:0.5;" width="299.2637" x="938.2515" y="854.6484"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="279.2637" x="948.2515" y="875.7871">Atualiza DATA_EMISSAO e/ou VALIDADE_DATA</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="95.1563" x="948.2515" y="889.7559">do CR existente</text><rect fill="#DDEEFF" height="33.9688" rx="12.5" ry="12.5" style="stroke:#416783;stroke-width:0.5;" width="260.8555" x="957.4556" y="937.5859"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="240.8555" x="967.4556" y="958.7246">Insere hist&#243;rico para cada data alterada</text><rect fill="#DDEEFF" height="33.9688" rx="12.5" ry="12.5" style="stroke:#416783;stroke-width:0.5;" width="327.8457" x="923.9604" y="1006.5547"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="307.8457" x="933.9604" y="1027.6934">R