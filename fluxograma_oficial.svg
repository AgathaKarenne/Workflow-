ngth="207.4351" x="884.8724" y="145.645">e prepara os dados de controle.</text><rect fill="#F8F9FA" height="33.9688" rx="12.5" ry="12.5" style="stroke:#59636E;stroke-width:0.5;" width="153.6113" x="705.2611" y="116.5938"/><text fill="#202124" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="133.6113" x="715.2611" y="137.7324">A01 - Preparar an&#225;lise</text><path d="M892.9789,163.7109 L892.9789,210.1094 L872.9789,214.1094 L892.9789,218.1094 L892.9789,264.5078 A0,0 0 0 0 892.9789,264.5078 L1363.2977,264.5078 A0,0 0 0 0 1363.2977,264.5078 L1363.2977,173.7109 L1353.2977,163.7109 L892.9789,163.7109 A0,0 0 0 0 892.9789,163.7109" fill="#FFF8E1" style="stroke:#C69214;stroke-width:0.5;"/><path d="M1353.2977,163.7109 L1353.2977,173.7109 L1363.2977,173.7109 L1353.2977,163.7109" fill="#FFF8E1" style="stroke:#C69214;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="233.4541" x="898.9789" y="180.7778">PF: CPF &#8594; GET /pessoas-civis/{CPF}</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="392.0059" x="898.9789" y="195.9106">Dados observados na aplica&#231;&#227;o: nome, e-mail/identifica&#231;&#227;o,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="292.4619" x="898.9789" y="211.0435">n&#250;mero do CR, status, atividades e validade.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="898.9789" y="226.1763">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="333.2837" x="898.9789" y="241.3091">PJ e Militar: identifica&#231;&#227;o conforme cadastro local e</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="449.3188" x="898.9789" y="256.4419">par&#226;metros do processo; n&#227;o presumir API espec&#237;fica sem evid&#234;ncia.</text><rect fill="#F8F9FA" height="33.9688" rx="12.5" ry="12.5" style="stroke:#59636E;stroke-width:0.5;" width="181.8242" x="691.1547" y="197.125"/><text fill="#202124" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="161.8242" x="701.1547" y="218.2637">A02 - Identificar solicitante</text><path d="M926.8754,332.9102 L926.8754,349.043 L906.8754,353.043 L926.8754,357.043 L926.8754,373.1758 A0,0 0 0 0 926.8754,373.1758 L1327.5795,373.1758 A0,0 0 0 0 1327.5795,373.1758 L1327.5795,342.9102 L1317.5795,332.9102 L926.8754,332.9102 A0,0 0 0 0 926.8754,332.9102" fill="#FFF8E1" style="stroke:#C69214;stroke-width:0.5;"/><path d="M1317.5795,332.9102 L1317.5795,342.9102 L1327.5795,342.9102 L1317.5795,332.9102" fill="#FFF8E1" style="stroke:#C69214;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="379.7041" x="932.8754" y="349.9771">Cadastro n&#227;o localizado n&#227;o significa rejei&#231;&#227;o autom&#225;tica.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="317.2432" x="932.8754" y="365.1099">Encaminha para an&#225;lise/regulariza&#231;&#227;o cadastral.</text><rect fill="#F8F9FA" height="33.9688" rx="12.5" ry="12.5" style="stroke:#59636E;stroke-width:0.5;" width="249.6172" x="657.2582" y="336.0586"/><text fill="#202124" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="229.6172" x="667.2582" y="357.1973">A03 - Analisar cadastro n&#227;o localizado</text><rect fill="#F8F9FA" height="33.9688" rx="12.5" ry="12.5" style="stroke:#59636E;stroke-width:0.5;" width="241.8535" x="661.14" y="441.5781"/><text fill="#202124" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="221.8535" x="671.14" y="462.7168">Encerrar como an&#225;lise n&#227;o conclu&#237;da</text><ellipse cx="782.0668" cy="515.0625" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="782.0668" cy="515.0625" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#FFF4CC" points="684.1141,393.1758,880.0194,393.1758,892.0194,405.1758,880.0194,417.1758,684.1141,417.1758,672.1141,405.1758,684.1141,393.1758" style="stroke:#B7791F;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="24.4116" x="786.0668" y="427.3862">N&#195;O</text><text fill="#202124" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="195.9053" x="684.1141" y="408.9839">Cadastro regularizado/identificado?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.7173" x="892.0194" y="402.5815">SIM</text><polygon fill="#FFF4CC" points="716.0936,284.5078,848.0399,284.5078,860.0399,296.5078,848.0399,308.5078,716.0936,308.5078,704.0936,296.5078,716.0936,284.5078" style="stroke:#B7791F;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="24.4116" x="786.0668" y="318.7183">N&#195;O</text><text fill="#202124" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="131.9463" x="716.0936" y="300.3159">Solicitante identificado?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.7173" x="860.0399" y="293.9136">SIM</text><polygon fill="#FFF4CC" points="782.0668,568.0625,794.0668,580.0625,782.0668,592.0625,770.0668,580.0625,782.0668,568.0625" style="stroke:#B7791F;stroke-width:0.5;"/><rect fill="none" height="288.0234" style="stroke:#000000;stroke-width:1.5;" width="747.9688" x="622.6429" y="614.0625"/><path d="M846.6351,614.0625 L846.6351,623.3594 L836.6351,633.3594 L622.6429,633.3594" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="213.9922" x="625.6429" y="628.0576">2. CR EXISTENTE E HIST&#211;RICO</text><path d="M904.891,643.3594 L904.891,682.1914 L884.891,686.1914 L904.891,690.1914 L904.891,729.0234 A0,0 0 0 0 904.891,729.0234 L1272.454,729.0234 A0,0 0 0 0 1272.454,729.0234 L1272.454,653.3594 L1262.454,643.3594 L904.891,643.3594 A0,0 0 0 0 904.891,643.3594" fill="#FFF8E1" style="stroke:#C69214;stroke-width:0.5;"/><path d="M1262.454,643.3594 L1262.454,653.3594 L1272.454,653.3594 L1262.454,643.3594" fill="#FFF8E1" style="stroke:#C69214;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="265.7637" x="910.891" y="660.4263">Fonte local principal: CR_PROD_CTRLDO.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="345.3188" x="910.891" y="675.5591">Relaciona o solicitante pelos campos de PF/PJ/Militar.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="910.891" y="690.6919">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="312.9458" x="910.891" y="705.8247">Tamb&#233;m existe consulta real ao SIGMA para PF:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="346.563" x="910.891" y="720.9575">CPF &#8594; n&#250;mero do CR &#8594; consulta de n&#237;vel do atirador.</text><rect fill="#F8F9FA" height="33.9688" rx="12.5" ry="12.5" style="stroke:#59636E;stroke-width:0.5;" width="205.6484" x="679.2426" y="669.207"/><text fill="#202124" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="185.6484" x="689.2426" y="690.3457">A04 - Consultar CRs existentes</text><path d="M951.4906,739.0234 L951.4906,762.7227 L931.4906,766.7227 L951.4906,770.7227 L951.4906,794.4219 A0,0 0 0 0 951.4906,794.4219 L1360.6117,794.4219 A0,0 0 0 0 1360.6117,794.4219 L1360.6117,749.0234 L1350.6117,739.0234 L951.4906,739.0234 A0,0 0 0 0 951.4906,739.0234" fill="#FFF8E1" style="stroke:#C69214;stroke-width:0.5;"/><path d="M1350.6117,739.0234 L1350.6117,749.0234 L1360.6117,749.0234 L1350.6117,739.0234" fill="#FFF8E1" style="stroke:#C69214;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="356.2432" x="957.4906" y="756.0903">Registrar CRs encontrados, estado atual e refer&#234;ncias.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="388.1211" x="957.4906" y="771.2231">A aus&#234;ncia de CR anterior &#233; um achado v&#225;lido do processo,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="156.8442" x="957.4906" y="786.356">n&#227;o uma falha por si s&#243;.</text><rect fill="#F8F9FA" height="33.9688" rx="12.5" ry="12.5" style="stroke:#59636E;stroke-width:0.5;" width="298.8477" x="632.6429" y="749.7383"/><text fill="#202124" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="278.8477" x="642.6429" y="770.877">A05 - Registrar situa&#231;&#227;o dos CRs e refer&#234;ncias</text><path d="M902.2191,804.4219 L902.2191,843.2539 L882.2191,847.2539 L902.2191,851.2539 L902.2191,890.0859 A0,0 0 0 0 902.2191,890.0859 L1292.6019,890.0859 A0,0 0 0 0 1292.6019,890.0859 L1292.6019,814.4219 L1282.6019,804.4219 L902.2191,804.4219 A0,0 0 0 0 902.2191,804.4219" fill="#FFF8E1" style="stroke:#C69214;stroke-width:0.5;"/><path d="M1282.6019,804.4219 L1282.6019,814.4219 L1292.6019,814.4219 L1282.6019,804.4219" fill="#FFF8E1" style="stroke:#C69214;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="249.8818" x="908.2191" y="821.4888">Fonte: HISTORICO_CR_PROD_CTRLDO.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="324.6826" x="908.2191" y="836.6216">Avaliar os registros relacionados ao CR relevante.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="908.2191" y="851.7544">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="366.1519" x="908.2191" y="866.8872">O crit&#233;rio de decis&#227;o deve ser baseado em achados que</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="369.3828" x="908.2191" y="882.02">exigem an&#225;lise, e n&#227;o apenas na exist&#234;ncia de hist&#243;rico.</text><rect fill="#F8F9FA" height="33.9688" rx="12.5" ry="12.5" style="stroke:#59636E;stroke-width:0.5;" width="200.3047" x="681.9144" y="830.2695"/><text fill="#202124" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="180.3047" x="691.9144" y="851.4082">A06 - Verificar hist&#243;rico do CR</text><rect fill="none" height="827.7813" style="stroke:#000000;stroke-width:1.5;" width="1155.7119" x="226.5131" y="912.0859"/><path d="M631.056,912.0859 L631.056,921.3828 L621.056,931.3828 L226.5131,931.3828" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="394.543" x="229.5131" y="926.0811">3. ATIVIDADES, ACERVO, ARMAS E HIST&#211;RICO DA ARMA</text><path d="M946.5365,941.3828 L946.5365,1002.9141 L926.5365,1006.9141 L946.5365,1010.9141 L946.5365,1072.4453 A0,0 0 0 0 946.5365,1072.4453 L1325.8173,1072.4453 A0,0 0 0 0 1325.8173,1072.4453 L1325.8173,951.3828 L1315.8173,941.3828 L946.5365,941.3828 A0,0 0 0 0 946.5365,941.3828" fill="#FFF8E1" style="stroke:#C69214;stroke-width:0.5;"/><path d="M1315.8173,941.3828 L1315.8173,951.3828 L1325.8173,951.3828 L1315.8173,941.3828" fill="#FFF8E1" style="stroke:#C69214;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="205.3975" x="952.5365" y="958.4497">Rela&#231;&#227;o comprovada no banco:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="952.5365" y="973.5825">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="121.7607" x="952.5365" y="988.7153">CR_PROD_CTRLDO</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="143.7363" x="960.8011" y="1003.8481">&#8594; ATV_REGULADA_CR</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="253.9126" x="960.8011" y="1018.981">&#8594; ATIVIDADE_COM_PRODUTO_CTRLDO</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="952.5365" y="1034.1138">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="358.2808" x="952.5365" y="1049.2466">ATV_REGULADA_CR usa CR_PROD_CTRLDO_NUMERO e</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="189.6743" x="952.5365" y="1064.3794">ATV_PROD_CTRLDO_COD_ID.</text><rect fill="#F8F9FA" height="33.9688" rx="12.5" ry="12.5" style="stroke:#59636E;stroke-width:0.5;" width="288.9395" x="637.597" y="989.9297"/><text fill="#202124" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="268.9395" x="647.597" y="1011.0684">A07 - Identificar atividades vinculadas ao CR</text><path d="M925.3607,1082.4453 L925.3607,1136.4102 L905.3607,1140.4102 L925.3607,1144.4102 L925.3607,1198.375 A0,0 0 0 0 925.3607,1198.375 L1372.225,1198.375 A0,0 0 0 0 1372.225,1198.375 L1372.225,1092.4453 L1362.225,1082.4453 L925.3607,1082.4453 A0,0 0 0 0 925.3607,1082.4453" fill="#FFF8E1" style="stroke:#C69214;stroke-width:0.5;"/><path d="M1362.225,1082.4453 L1362.225,1092.4453 L1372.225,1092.4453 L1362.225,1082.4453" fill="#FFF8E1" style="stroke:#C69214;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="348.1309" x="931.3607" y="1099.5122">Rela&#231;&#227;o usada pela aplica&#231;&#227;o para chegar ao acervo:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="931.3607" y="1114.645">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="178.4834" x="931.3607" y="1129.7778">atividade &#8594; ACERVO_ARMA</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="931.3607" y="1144.9106">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="365.1045" x="931.3607" y="1160.0435">ACERVO_ARMA tamb&#233;m cont&#233;m datas de CRAF, porte e</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="425.8643" x="931.3607" y="1175.1763">documento. N&#227;o transformar esses campos em regra autom&#225;tica</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="224.1294" x="931.3607" y="1190.3091">sem regra de neg&#243;cio confirmada.</text><rect fill="#F8F9FA" height="33.9688" rx="12.5" ry="12.5" style="stroke:#59636E;stroke-width:0.5;" width="246.5879" x="658.7728" y="1123.4258"/><text fill="#202124" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="226.5879" x="668.7728" y="1144.5645">A08 - Consultar acervo pela atividade</text><polygon fill="#FFF4CC" points="701.3607,1218.375,862.7728,1218.375,874.7728,1230.375,862.7728,1242.375,701.3607,1242.375,689.3607,1230.375,701.3607,1218.375" style="stroke:#B7791F;stroke-width:0.5;"/><text fill="#202124" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="161.4121" x="701.3607" y="1234.1831">Existem armas relacionadas?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.7173" x="669.6434" y="1227.7808">SIM</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textL