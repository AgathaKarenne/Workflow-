8.2876" x="578.1752" y="1378.8091">Fonte: ACERVO_ARMA.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="367.7007" x="578.1752" y="1393.9419">Consultar CRAF, porte e documento quando dispon&#237;veis.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="316.2783" x="578.1752" y="1409.0747">Campos documentais s&#227;o VARCHAR2 no acervo.</text><rect fill="#F8F9FA" height="33.9688" rx="12.5" ry="12.5" style="stroke:#59636E;stroke-width:0.5;" width="288.1719" x="264.0033" y="1372.457"/><text fill="#202124" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="268.1719" x="274.0033" y="1393.5957">A10 - Consultar dados documentais da arma</text><path d="M539.1576,1427.1406 L539.1576,1481.1055 L519.1576,1485.1055 L539.1576,1489.1055 L539.1576,1543.0703 A0,0 0 0 0 539.1576,1543.0703 L912.224,1543.0703 A0,0 0 0 0 912.224,1543.0703 L912.224,1437.1406 L902.224,1427.1406 L539.1576,1427.1406 A0,0 0 0 0 539.1576,1427.1406" fill="#FFF8E1" style="stroke:#C69214;stroke-width:0.5;"/><path d="M902.224,1427.1406 L902.224,1437.1406 L912.224,1437.1406 L902.224,1427.1406" fill="#FFF8E1" style="stroke:#C69214;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="166.1563" x="545.1576" y="1444.2075">Fonte: HISTORICO_ARMA.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="350.7271" x="545.1576" y="1459.3403">A aplica&#231;&#227;o existente consulta os tipos de ocorr&#234;ncia:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="100.1914" x="553.4222" y="1474.4731">1 = AQUISI&#199;&#195;O</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="135.7383" x="553.4222" y="1489.606">3 = TRANSFER&#202;NCIA</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="257.9941" x="553.4222" y="1504.7388">19 = TRANSFER&#202;NCIA ENTRE ACERVOS</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="545.1576" y="1519.8716">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="352.0664" x="545.1576" y="1535.0044">A ocorr&#234;ncia n&#227;o &#233;, isoladamente, motivo de rejei&#231;&#227;o.</text><rect fill="#F8F9FA" height="33.9688" rx="12.5" ry="12.5" style="stroke:#59636E;stroke-width:0.5;" width="222.1367" x="297.0209" y="1468.1211"/><text fill="#202124" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="202.1367" x="307.0209" y="1489.2598">A11 - Consultar hist&#243;rico da arma</text><path d="M589.6654,1553.0703 L589.6654,1599.4688 L569.6654,1603.4688 L589.6654,1607.4688 L589.6654,1653.8672 A0,0 0 0 0 589.6654,1653.8672 L966.5023,1653.8672 A0,0 0 0 0 966.5023,1653.8672 L966.5023,1563.0703 L956.5023,1553.0703 L589.6654,1553.0703 A0,0 0 0 0 589.6654,1553.0703" fill="#FFF8E1" style="stroke:#C69214;stroke-width:0.5;"/><path d="M956.5023,1553.0703 L956.5023,1563.0703 L966.5023,1563.0703 L956.5023,1553.0703" fill="#FFF8E1" style="stroke:#C69214;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="306.4204" x="595.6654" y="1570.1372">HISTORICO_ARMA.ATV_PROD_CTRLDO_COD_ID</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="253.9126" x="603.9301" y="1585.27">&#8594; ATIVIDADE_COM_PRODUTO_CTRLDO</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="91.6475" x="603.9301" y="1600.4028">&#8594; DESCRICAO</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="595.6654" y="1615.5356">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="355.8369" x="595.6654" y="1630.6685">A aplica&#231;&#227;o existente busca a ocorr&#234;ncia mais recente</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="172.5801" x="595.6654" y="1645.8013">entre os tipos observados.</text><rect fill="#F8F9FA" height="33.9688" rx="12.5" ry="12.5" style="stroke:#59636E;stroke-width:0.5;" width="323.1523" x="246.5131" y="1586.4844"/><text fill="#202124" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="303.1523" x="256.5131" y="1607.623">A12 - Identificar atividade/descri&#231;&#227;o da ocorr&#234;ncia</text><polygon fill="#FFF4CC" points="408.0892,1252.375,420.0892,1264.375,408.0892,1276.375,396.0892,1264.375,408.0892,1252.375" style="stroke:#B7791F;stroke-width:0.5;"/><polygon fill="#FFF4CC" points="346.8802,1673.8672,469.2982,1673.8672,481.2982,1685.8672,469.2982,1697.8672,346.8802,1697.8672,334.8802,1685.8672,346.8802,1673.8672" style="stroke:#B7791F;stroke-width:0.5;"/><text fill="#202124" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="122.418" x="346.8802" y="1689.6753">Ainda existem armas?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.7173" x="481.2982" y="1683.2729">SIM</text><rect fill="#F8F9FA" height="33.9688" rx="12.5" ry="12.5" style="stroke:#59636E;stroke-width:0.5;" width="291.084" x="1010.5023" y="1252.375"/><text fill="#202124" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="271.084" x="1020.5023" y="1273.5137">A13 - Registrar aus&#234;ncia de armas no acervo</text><polygon fill="#FFF4CC" points="782.0668,1703.8672,794.0668,1715.8672,782.0668,1727.8672,770.0668,1715.8672,782.0668,1703.8672" style="stroke:#B7791F;stroke-width:0.5;"/><rect fill="none" height="591.6328" style="stroke:#000000;stroke-width:1.5;" width="1322.8304" x="11" y="1749.8672"/><path d="M269.0762,1749.8672 L269.0762,1759.1641