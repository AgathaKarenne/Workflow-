 fill="#F8F9FA" height="33.9688" rx="12.5" ry="12.5" style="stroke:#59636E;stroke-width:0.5;" width="299.7441" x="624.5796" y="2070.4766"/><text fill="#202124" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="279.7441" x="634.5796" y="2091.6152">A19 - Encaminhar para an&#225;lise do respons&#225;vel</text><polygon fill="#FFF4CC" points="459.9377,2275.5,471.9377,2287.5,459.9377,2299.5,447.9377,2287.5,459.9377,2275.5" style="stroke:#B7791F;stroke-width:0.5;"/><rect fill="#F8F9FA" height="33.9688" rx="12.5" ry="12.5" style="stroke:#59636E;stroke-width:0.5;" width="299.7441" x="954.3237" y="2036.4766"/><text fill="#202124" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="279.7441" x="964.3237" y="2057.6152">A19 - Encaminhar para an&#225;lise do respons&#225;vel</text><polygon fill="#FFF4CC" points="782.0668,2305.5,794.0668,2317.5,782.0668,2329.5,770.0668,2317.5,782.0668,2305.5" style="stroke:#B7791F;stroke-width:0.5;"/><rect fill="none" height="518.7344" style="stroke:#000000;stroke-width:1.5;" width="1586.9287" x="189.7987" y="2351.5"/><path d="M347.5507,2351.5 L347.5507,2360.7969 L337.5507,2370.7969 L189.7987,2370.7969" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="147.752" x="192.7987" y="2365.4951">5. DECIS&#195;O HUMANA</text><path d="M929.5385,2380.7969 L929.5385,2404.4961 L909.5385,2408.4961 L929.5385,2412.4961 L929.5385,2436.1953 A0,0 0 0 0 929.5385,2436.1953 L1353.9574,2436.1953 A0,0 0 0 0 1353.9574,2436.1953 L1353.9574,2390.7969 L1343.9574,2380.7969 L929.5385,2380.7969 A0,0 0 0 0 929.5385,2380.7969" fill="#FFF8E1" style="stroke:#C69214;stroke-width:0.5;"/><path d="M1343.9574,2380.7969 L1343.9574,2390.7969 L1353.9574,2390.7969 L1343.9574,2380.7969" fill="#FFF8E1" style="stroke:#C69214;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="85.3569" x="935.5385" y="2397.8638">Human Task.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="403.4189" x="935.5385" y="2412.9966">O respons&#225;vel avalia os achados e decide conforme as regras</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="158.8691" x="935.5385" y="2428.1294">institucionais aplic&#225;veis.</text><rect fill="#F8F9FA" height="33.9688" rx="12.5" ry="12.5" style="stroke:#59636E;stroke-width:0.5;" width="254.9434" x="654.5951" y="2391.5117"/><text fill="#202124" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="234.9434" x="664.5951" y="2412.6504">A20 - An&#225;lise e decis&#227;o do respons&#225;vel</text><polygon fill="#FFF4CC" points="713.7679,2456.1953,850.3656,2456.1953,862.3656,2468.1953,850.3656,2480.1953,713.7679,2480.1953,701.7679,2468.1953,713.7679,2456.1953" style="stroke:#B7791F;stroke-width:0.5;"/><text fill="#202124" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="136.5977" x="713.7679" y="2472.0034">Decis&#227;o do respons&#225;vel?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="53.1523" x="648.6156" y="2465.6011">APROVAR</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="49.9189" x="862.3656" y="2465.6011">REJEITAR</text><rect fill="none" height="338.0391" style="stroke:#000000;stroke-width:1.5;" width="832.1904" x="209.7987" y="2490.1953"/><path d="M464.2723,2490.1953 L464.2723,2499.4922 L454.2723,2509.4922 L209.7987,2509.4922" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="244.4736" x="212.7987" y="2504.1904">6. EMISS&#195;O / ATUALIZA&#199;&#195;O DO CR</text><path d="M498.161,2526.4922 L498.161,2550.1914 L478.161,2554.1914 L498.161,2558.1914 L498.161,2581.8906 A0,0 0 0 0 498.161,2581.8906 L919.6093,2581.8906 A0,0 0 0 0 919.6093,2581.8906 L919.6093,2536.4922 L909.6093,2526.4922 L498.161,2526.4922 A0,0 0 0 0 498.161,2526.4922" fill="#FFF8E1" style="stroke:#C69214;stroke-width:0.5;"/><path d="M909.6093,2526.4922 L909.6093,2536.4922 L919.6093,2536.4922 L909.6093,2526.4922" fill="#FFF8E1" style="stroke:#C69214;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="293.9854" x="504.161" y="2543.5591">Preparar a opera&#231;&#227;o de emiss&#227;o/atualiza&#231;&#227;o.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="400.4482" x="504.161" y="2558.6919">N&#227;o assumir que todo caso ser&#225; apenas um UPDATE simples:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="347.5151" x="504.161" y="2573.8247">a opera&#231;&#227;o deve seguir a rotina/servi&#231;o homologado.</text><rect fill="#F8F9FA" height="33.9688" rx="12.5" ry="12.5" style="stroke:#59636E;stroke-width:0.5;" width="212.2051" x="265.9559" y="2537.207"/><text fill="#202124" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="192.2051" x="275.9559" y="2558.3457">A21 - Preparar CR para emiss&#227;o</text><path d="M532.9218,2613.3203 L532.9218,2644.5859 L512.9218,2648.5859 L532.9218,2652.5859 L532.9218,2683.8516 A0,0 0 0 0 532.9218,2683.8516 L1031.9891,2683.8516 A0,0 0 0 0 1031.9891,2683.8516 L1031.9891,2623.3203 L1021.9891,2613.3203 L532.9218,2613.3203 A0,0 0 0 0 532.9218,2613.3203" fill="#FFF8E1" style="stroke:#C69214;stroke-width:0.5;"/><path d="M1021.9891,2613.3203 L1021.9891,2623.3203 L1031.9891,2623.3203 L1021.9891,2613.3203" fill="#FFF8E1" style="stroke:#C69214;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="425.604" x="538.9218" y="2630.3872">Persist&#234;ncia final do CR conforme a implementa&#231;&#227;o homologada.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="478.0674" x="538.9218" y="2645.52">Pode envolver CR_PROD_CTRLDO e integra&#231;&#227;o externa quando aplic&#225;vel.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="393.5103" x="538.9218" y="2660.6528">O endpoint espec&#237;fico de emiss&#227;o ainda n&#227;o foi comprovado</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="412.3374" x="538.9218" y="2675.7856">nas consultas realizadas; portanto n&#227;o &#233; fixado neste desenho.</text><rect fill="#F8F9FA" height="33.9688" rx="12.5" ry="12.5" style="stroke:#59636E;stroke-width:0.5;" width="281.7266" x="231.1952" y="2631.6016"/><text fill="#202124" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="261.7266" x="241.1952" y="2652.7402">A22 - Executar emiss&#227;o / atualiza&#231;&#227;o do CR</text><path d="M544.3182,2718.8516 L544.3182,2734.9844 L524.3182,2738.9844 L544.3182,2742.9844 L544.3182,2759.1172 A0,0 0 0 0 544.3182,2759.1172 L861.0555,2759.1172 A0,0 0 0 0 861.0555,2759.1172 L861.0555,2728.8516 L851.0555,2718.8516 L544.3182,2718.8516 A0,0 0 0 0 544.3182,2718.8516" fill="#FFF8E1" style="stroke:#C69214;stroke-width:0.5;"/><path d="M851.0555,2718.8516 L851.0555,2728.8516 L861.0555,2728.8516 L851.0555,2718.8516" fill="#FFF8E1" style="stroke:#C69214;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="284.3052" x="550.3182" y="2735.9185">Fonte local: HISTORICO_CR_PROD_CTRLDO.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="295.7373" x="550.3182" y="2751.0513">Registrar o resultado efetivamente realizado.</text><rect fill="#F8F9FA" height="33.9688" rx="12.5" ry="12.5" style="stroke:#59636E;stroke-width:0.5;" width="304.5195" x="219.7987" y="2722"/><text fill="#202124" font-fam