" x="1176.7548" y="3055.3076">&#8226; ACERVO_ARMA &#8594; propriet&#225;rio/CR e dados documentais</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="287.7178" x="1176.7548" y="3071.6045">&#8226; ARMA.STATUS_IND = situa&#231;&#227;o da arma</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="282.0029" x="1176.7548" y="3087.9014">&#8226; HISTORICO_ARMA = hist&#243;rico da arma</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="267.4355" x="1176.7548" y="3104.1982">&#8226; tipos observados no c&#243;digo: 1, 3, 19</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="488.8584" x="1176.7548" y="3120.4951">&#8226; 1 = Aquisi&#231;&#227;o; 3 = Transfer&#234;ncia; 19 = Transfer&#234;ncia entre acervos</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="470.1348" x="1176.7548" y="3136.792">&#8226; Nenhum desses tipos, isoladamente, implica rejei&#231;&#227;o autom&#225;tica</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="470.5791" x="1176.7548" y="3153.0889">&#8226; Regras autom&#225;ticas s&#243; devem ser aplicadas quando confirmadas</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="467.1064" x="1176.7548" y="3169.3857">&#8226; Endpoint espec&#237;fico de emiss&#227;o do CR ainda n&#227;o foi comprovado</text></g><?plantuml-src bLdBRXl95TtpAmgJZGt8f2dvAK48scHpp855AYJb1Da8vUuILN6pY-vgqfuC34mG806oJF83dba43Z0h8vji-q_y9JctghgxcYyxseYinwtxFFT1_LgcIvxn1Nl5ezVpJAtIkASIbR6tjp8NBLtjwriUgxSodRCRdcX_XqUvNClyU_P3Yx5d6sH-DNWoU3e8Q4TbiSZSwiEdZquUXLWTg3HtQyVtZxl73x3MbtoXqdYRr63meDVp3lWKdpr-_BGxmEOqvrb5qlnXCQo8kANtdW2foiKUvWU39s5ta_dUewV7tGSWqPh9F15iaApUgJaeSVRvnt-otmvOk91Q5pyh5WlMcx0xBq_kcgs-q2AzLVX_8rC9jQbMInE_hHPOoR6YKlPDjyt2qMmIz0CMi