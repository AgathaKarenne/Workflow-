f" font-size="13" lengthAdjust="spacing" textLength="158.939" x="893.4271" y="1853.3481">Classifica&#231;&#245;es poss&#237;veis:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="66.8535" x="901.6918" y="1868.481">&#8226; AN&#193;LISE</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="87.3311" x="901.6918" y="1883.6138">&#8226; PEND&#202;NCIA</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="122.4146" x="901.6918" y="1898.7466">&#8226; INCONSIST&#202;NCIA</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="73.8042" x="901.6918" y="1913.8794">&#8226; REGULAR</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="893.4271" y="1929.0122">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="415.4033" x="893.4271" y="1944.145">O workflow n&#227;o deve inventar consequ&#234;ncia a partir dos dados.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="413.1309" x="893.4271" y="1959.2778">Apenas regras de neg&#243;cio confirmadas podem determinar uma</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="182.2222" x="893.4271" y="1974.4106">a&#231;&#227;o autom&#225;tica espec&#237;fica.</text><rect fill="#F8F9FA" height="33.9688" rx="12.5" ry="12.5" style="stroke:#59636E;stroke-width:0.5;" width="170.7207" x="696.7064" y="1892.3945"/><text fill="#202124" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="150.7207" x="706.7064" y="1913.5332">A15 - Classificar achados</text><polygon fill="#FFF4CC" points="675.5123,2002.4766,888.6212,2002.4766,900.6212,2014.4766,888.6212,2026.4766,675.5123,2026.4766,663.5123,2014.4766,675.5123,2002.4766" style=